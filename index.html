<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="sheet">
    <header class="topline">
      <p class="date" id="dateLine"></p>
      <h1>My Tasks</h1>
    </header>

    <nav class="lists" id="listTabs">
      <button class="list-tab" data-list="school">School</button>
      <button class="list-tab" data-list="personal">Personal</button>
      <button class="list-tab" data-list="other">Other</button>
    </nav>
    <p class="count" id="countLine"></p>

    <div class="add-row">
      <button class="add-toggle" id="addToggle" aria-label="Add a task">
        <span class="plus"></span>
      </button>
      <input type="text" id="todoInput" placeholder="Add a task" maxlength="80" autocomplete="off">
      <button class="label-toggle" id="labelToggle" aria-label="Add a label" title="Add a label"></button>
    </div>

    <div class="label-picker" id="labelPicker" hidden>
      <input type="text" id="labelInput" placeholder="Label name" list="labelOptions" maxlength="20" autocomplete="off">
      <datalist id="labelOptions"></datalist>
      <span class="label-picker-hint">Enter to attach · Esc to skip</span>
    </div>

    <ul class="tasklist" id="activeList"></ul>

    <section class="completed-section" id="completedSection" hidden>
      <button class="completed-toggle" id="completedToggle">
        <span class="chevron"></span>
        <span id="completedLabel">Completed</span>
      </button>
      <ul class="tasklist completed" id="completedList"></ul>
    </section>

    <p class="empty" id="emptyState" hidden>Nothing here. Add something above.</p>
  </main>

<script src="script.js"></script>
</body>
</html>
